<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LP Assistant AI chatbot</title>
  <style>
    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      height: 100vh;
      height: 100dvh;
      margin: 0 auto;
      padding: 20px;
      background-color: #001f3f;
      color: #f5f7fa;
    }

    main {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }

    main > :not(#chat) {
      flex-shrink: 0;
    }

    .page-header {
      display: grid;
      grid-template-columns: 56px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }

    .header-logo {
      width: 56px;
      height: 56px;
      object-fit: contain;
      flex-shrink: 0;
    }

    h1 {
      color: #f5f7fa;
      font-size: 1.75rem;
      margin: 0;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    #chat {
      display: flex;
      flex-direction: column;
      border: 1px solid #ccc;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 15px;
      background: white;
      margin-bottom: 10px;
      border-radius: 8px;
    }

    .message {
      width: fit-content;
      margin: 10px 0;
      padding: 12px 16px;
      border-radius: 18px;
      max-width: 85%;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message a {
      overflow-wrap: anywhere;
    }

    .message-sources {
      font-size: calc(1em - 2pt);
    }

    .user {
      background-color: #d6eaff;
      color: #003366;
      margin-left: auto;
      border-bottom-right-radius: 4px;
    }

    .bot {
      background-color: #f1f1f1;
      color: #333;
      margin-right: auto;
      border-bottom-left-radius: 4px;
    }

    .feedback {
      color: #555;
      font-size: 0.9em;
      margin: 4px 0 12px;
    }

    .feedback button {
      color: #0056a6;
      text-decoration: underline;
      cursor: pointer;
    }

    .feedback button {
      padding: 0 3px;
      border: 0;
      background: transparent;
      font-size: inherit;
    }

    .composer {
      display: flex;
      gap: 10px;
    }

    input,
    button {
      padding: 10px;
      font-size: 16px;
    }

    input {
      flex: 1;
      min-width: 0;
      background-color: #d6eaff;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
    }

    #sendButton {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      flex-shrink: 0;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    #postChatFeedback {
      margin-top: 12px;
      border-top: 1px solid #ffffff33;
    }

    .rating {
      margin: 12px 0;
      font-size: 1rem;
    }

    .star {
      padding: 0 2px;
      border: 0;
      background: transparent;
      color: #ccc;
      font-size: 1.5rem;
    }

    .star.active {
      color: #ffdf00;
      text-shadow: 0 0 1px #805900;
    }

    .feedback-form {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .feedback-form textarea {
      flex: 1;
      min-width: 0;
      padding: 8px;
      border: 1px solid #9ca3af;
      border-radius: 4px;
      background-color: #e5e7eb;
      color: #333;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.4;
      resize: none;
    }

    .feedback-form textarea::placeholder {
      color: #5f6368;
      opacity: 1;
    }

    .feedback-submit {
      flex-shrink: 0;
      padding: 8px 14px;
      border: 1px solid #999;
      border-radius: 4px;
      background-color: #d1d1d1;
      color: #222;
      font-size: 14px;
    }

    .feedback-submit:hover,
    .feedback-submit:focus-visible {
      background-color: #bcbcbc;
    }

    #newChatButton {
      background-color: #fff;
      border: 1px solid #0056a6;
      color: #0056a6;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 14px;
      white-space: nowrap;
    }

    #newChatButton:hover,
    #newChatButton:focus-visible {
      background-color: #eef5ff;
    }

    :focus-visible {
      outline: 3px solid #005fcc;
      outline-offset: 2px;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .page-header {
        grid-template-columns: 56px minmax(0, 1fr);
        row-gap: 4px;
      }

      #newChatButton {
        grid-column: 2;
        justify-self: end;
      }

      #chat {
        padding: 12px;
      }

      .message {
        max-width: 92%;
      }

      .composer {
        gap: 8px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="page-header">
      <img class="header-logo" src="https://lp.post.ca.gov/Upload/logos/theme_6c8e8542.png"
        alt="Learning Portal logo" width="56" height="56">
      <h1>Learning Portal (LP) Assistant AI</h1>
      <button id="newChatButton" type="button">New Chat</button>
    </header>
    <div id="loading" role="status" aria-live="polite" hidden
      style="color: #ccc; font-style: italic; margin: 8px 0;">
      Thinking...
    </div>
    <div id="chat" role="log" aria-label="Chat messages" aria-live="polite" aria-relevant="additions"></div>

    <form id="messageForm" class="composer">
      <input type="text" id="messageInput" placeholder="Type your message..."
        aria-label="Type your message" autocomplete="off">
      <button id="sendButton" type="submit" aria-label="Submit message" title="Submit message">
        <svg class="lucide lucide-arrow-up" xmlns="http://www.w3.org/2000/svg"
          width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"
          aria-hidden="true" focusable="false">
          <path d="m5 12 7-7 7 7" />
          <path d="M12 19V5" />
        </svg>
      </button>
    </form>

    <div id="postChatFeedback" hidden>
      <div class="rating" role="group" aria-label="Rate your experience">
        Rate your experience:
        <button class="star" type="button" data-value="1" aria-label="1 star" aria-pressed="false">★</button>
        <button class="star" type="button" data-value="2" aria-label="2 stars" aria-pressed="false">★</button>
        <button class="star" type="button" data-value="3" aria-label="3 stars" aria-pressed="false">★</button>
        <button class="star" type="button" data-value="4" aria-label="4 stars" aria-pressed="false">★</button>
        <button class="star" type="button" data-value="5" aria-label="5 stars" aria-pressed="false">★</button>
      </div>

      <form id="feedbackForm" class="feedback-form">
        <textarea id="feedbackText" rows="2" placeholder="How was your experience?"
          aria-label="Your feedback"></textarea>
        <button type="submit" class="feedback-submit">Send Feedback</button>
      </form>
    </div>
  </main>

  <script>
    const chatDiv = document.getElementById('chat');
    const input = document.getElementById('messageInput');
    const messageForm = document.getElementById('messageForm');
    const sendButton = document.getElementById('sendButton');
    const loadingDiv = document.getElementById('loading');
    const newChatButton = document.getElementById('newChatButton');
    const postChatFeedback = document.getElementById('postChatFeedback');
    const feedbackForm = document.getElementById('feedbackForm');
    const feedbackText = document.getElementById('feedbackText');
    const FUNCTION_URL = 'https://lp-support-rag-api-fzcdgza2avb0ewf6.northcentralus-01.azurewebsites.net/api/Chat';
    // Staging feedback service. Swap to the production URL once provided.
    const FEEDBACK_URL = 'https://ltr-code3-feedbackservice-alpha-staging.azurewebsites.net/submit';

    // Opaque, server-issued conversation key. Null means "no active chat yet".
    let activeConversationId = null;

    // Identifies the current chat thread so a late response from a chat that
    // was replaced by "New Chat" cannot overwrite the active transcript/ID.
    let activeChatToken = 0;

    function appendFormattedText(parent, text) {
      const linkPattern = /https?:\/\/[^\s<>"']+|[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}|\(?\d{3}\)?[-.\s]?\d{3}[-.\s]?\d{4}/gi;
      let lastIndex = 0;

      for (const match of text.matchAll(linkPattern)) {
        const value = match[0];
        const start = match.index;
        const trailingPunctuation = value.match(/[.,!?;:]+$/)?.[0] || '';
        const linkText = value.slice(0, value.length - trailingPunctuation.length);

        parent.appendChild(document.createTextNode(text.slice(lastIndex, start)));

        if (linkText) {
          const link = document.createElement('a');
          link.textContent = linkText;

          if (/^https?:\/\//i.test(linkText)) {
            link.href = linkText;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
          } else if (linkText.includes('@')) {
            link.href = `mailto:${linkText}`;
          } else {
            link.href = `tel:${linkText.replace(/[^\d+]/g, '')}`;
          }

          parent.appendChild(link);
        }

        if (trailingPunctuation) {
          parent.appendChild(document.createTextNode(trailingPunctuation));
        }

        lastIndex = start + value.length;
      }

      parent.appendChild(document.createTextNode(text.slice(lastIndex)));
    }

    function addMessage(text, isUser) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${isUser ? 'user' : 'bot'}`;
      const messageText = String(text);
      const sourcePattern = /^Sources:[ \t]*\r?\n(?:[ \t]*\d+\.[ \t]+[^\r\n]+(?:\r?\n|$))+/gim;
      let lastIndex = 0;

      for (const match of isUser ? [] : messageText.matchAll(sourcePattern)) {
        appendFormattedText(msgDiv, messageText.slice(lastIndex, match.index));
        const sources = document.createElement('span');
        sources.className = 'message-sources';
        appendFormattedText(sources, match[0]);
        msgDiv.appendChild(sources);
        lastIndex = match.index + match[0].length;
      }

      appendFormattedText(msgDiv, messageText.slice(lastIndex));
      chatDiv.appendChild(msgDiv);
      chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    // Parses a fetch Response body defensively: gateways/platforms can return
    // non-JSON error pages, so a failed JSON parse must not be treated as a crash.
    async function readResponseBody(response) {
      try {
        return await response.json();
      } catch {
        return null;
      }
    }

    // Best-effort device/browser context included with feedback submissions.
    function detectFromApp() {
      const ua = navigator.userAgent;
      let browser = 'Unknown';
      if (ua.includes('Edg/')) browser = 'Edge';
      else if (ua.includes('Chrome/')) browser = 'Chrome';
      else if (ua.includes('Firefox/')) browser = 'Firefox';
      else if (ua.includes('Safari/')) browser = 'Safari';

      let OS = 'Unknown';
      if (ua.includes('Windows')) OS = 'Windows';
      else if (ua.includes('Mac OS')) OS = 'macOS';
      else if (ua.includes('Android')) OS = 'Android';
      else if (/iPhone|iPad/.test(ua)) OS = 'iOS';
      else if (ua.includes('Linux')) OS = 'Linux';

      const deviceType = /Mobi|Android|iPhone|iPad/.test(ua) ? 'mobile' : 'desktop';
      return { deviceType, browser, OS };
    }

    // Formats a Date as an ISO 8601 string in US Pacific time (America/Los_Angeles),
    // e.g. "2026-11-04T09:51:23.505-08:00". Automatically accounts for PST/PDT.
    function toPacificISOString(date) {
      const parts = Object.fromEntries(
        new Intl.DateTimeFormat('en-US', {
          timeZone: 'America/Los_Angeles',
          hourCycle: 'h23',
          year: 'numeric', month: '2-digit', day: '2-digit',
          hour: '2-digit', minute: '2-digit', second: '2-digit'
        }).formatToParts(date).map(p => [p.type, p.value])
      );
      const ms = String(date.getMilliseconds()).padStart(3, '0');

      // Derive the current Pacific UTC offset by comparing the Pacific wall-clock
      // (reinterpreted as UTC) against the original instant.
      const pacificAsUtcMs = Date.UTC(parts.year, parts.month - 1, parts.day, parts.hour, parts.minute, parts.second);
      const offsetMinutes = Math.round((pacificAsUtcMs - date.getTime()) / 60000);
      const sign = offsetMinutes <= 0 ? '-' : '+';
      const abs = Math.abs(offsetMinutes);
      const offH = String(Math.floor(abs / 60)).padStart(2, '0');
      const offM = String(abs % 60).padStart(2, '0');

      return `${parts.year}-${parts.month}-${parts.day}T${parts.hour}:${parts.minute}:${parts.second}.${ms}${sign}${offH}:${offM}`;
    }

    // Shared helper for all three feedback widgets. Submission failures are
    // logged but never surfaced to the user, since feedback is non-essential.
    async function submitFeedback(feature, response) {
      const payload = {
        source: 'LP Assistant AI',
        fromApp: detectFromApp(),
        feature,
        response,
        conversationId: activeConversationId || '',
        timestamp: toPacificISOString(new Date()),
        notified: 'no',
        status: 'active'
      };

      try {
        const res = await fetch(FEEDBACK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok) {
          console.error('Feedback submission failed with status', res.status);
        }
      } catch (error) {
        console.error('Feedback submission failed:', error);
      }
    }

    function resetRatingStars() {
      document.querySelectorAll('.star').forEach(star => {
        star.classList.remove('active');
        star.setAttribute('aria-pressed', 'false');
      });
    }

    function startNewChat() {
      activeConversationId = null;
      activeChatToken += 1;
      chatDiv.innerHTML = '';
      addMessage('Hello! How can I help you with the Learning Portal today?', false);
      input.value = '';
      // Reset any in-flight-request UI lockout from a chat this just replaced.
      loadingDiv.hidden = true;
      input.disabled = false;
      sendButton.disabled = false;
      // Rating/feedback widgets only make sense once there's an active
      // conversation to attach them to; hide and reset them for the new chat.
      postChatFeedback.hidden = true;
      resetRatingStars();
      feedbackForm.hidden = false;
      feedbackText.value = '';
      input.focus();
    }

    async function sendMessage() {
      const message = input.value.trim();
      if (!message || sendButton.disabled) return;

      // Capture which chat this request belongs to. If "New Chat" is clicked
      // before the response arrives, this token will no longer match the
      // active one and the late response must not overwrite the new chat.
      const chatToken = activeChatToken;

      addMessage(message, true);
      input.value = '';
      input.disabled = true;
      sendButton.disabled = true;
      loadingDiv.hidden = false;

      const requestController = new AbortController();
      const requestTimeout = setTimeout(() => requestController.abort(), 60000);

      try {
        const body = activeConversationId
          ? { message, conversationId: activeConversationId }
          : { message };

        const response = await fetch(FUNCTION_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
          signal: requestController.signal
        });

        const data = await readResponseBody(response);

        if (chatToken !== activeChatToken) {
          // The chat this request belonged to was replaced by "New Chat";
          // discard this response instead of updating the new chat's state.
          return;
        }

        if (!response.ok) {
          const errorMessage = typeof data?.error === 'string' && data.error
            ? data.error
            : `Chat request failed with status ${response.status}`;
          throw new Error(errorMessage);
        }

        if (typeof data?.conversationId !== 'string' ||
            !data.conversationId ||
            typeof data?.reply !== 'string') {
          throw new Error('Chat API returned an invalid success response.');
        }

        // Retain the server-issued conversationId so every later turn in this
        // chat round-trips it; this is what keeps backend memory continuous.
        const isFirstResponse = !activeConversationId;
        activeConversationId = data.conversationId;
        if (isFirstResponse) {
          submitFeedback('Conversation started', 'Started');
        }
        postChatFeedback.hidden = false;

        const replyText = data.reply.trim() ? data.reply : 'Sorry, I could not get a response.';
        addMessage(replyText, false);
        addFeedbackPrompt();
      } catch (error) {
        if (chatToken === activeChatToken) {
          const errorMessage = requestController.signal.aborted
            ? 'The response is taking too long. Please try again.'
            : 'Sorry, the chatbot could not process your request. Please try again later.';
          addMessage(errorMessage, false);
        }
        console.error('Chat request failed:', error);
      } finally {
        clearTimeout(requestTimeout);
        if (chatToken === activeChatToken) {
          loadingDiv.hidden = true;
          input.disabled = false;
          sendButton.disabled = false;
          input.focus();
        }
      }
    }

    function addFeedbackPrompt() {
      const feedbackDiv = document.createElement('div');
      feedbackDiv.className = 'feedback';
      feedbackDiv.append('Did this answer your question? ');

      for (const [index, label] of ['Yes', 'No'].entries()) {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = label;
        button.addEventListener('click', () => handleFeedback(feedbackDiv, label));
        feedbackDiv.appendChild(button);

        if (index === 0) feedbackDiv.append(' | ');
      }

      chatDiv.appendChild(feedbackDiv);
      chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    function handleFeedback(feedbackDiv, label) {
      feedbackDiv.textContent = 'Thank you for the feedback.';
      submitFeedback('Answered question?', label);
    }

    messageForm.addEventListener('submit', event => {
      event.preventDefault();
      sendMessage();
    });

    document.querySelectorAll('.star').forEach(star => {
      star.addEventListener('click', () => {
        const value = Number(star.dataset.value);
        document.querySelectorAll('.star').forEach(item => {
          const isActive = Number(item.dataset.value) <= value;
          item.classList.toggle('active', isActive);
          item.setAttribute('aria-pressed', String(Number(item.dataset.value) === value));
        });
        submitFeedback('Experience rating', String(value));
      });
    });

    feedbackForm.addEventListener('submit', event => {
      event.preventDefault();
      const text = feedbackText.value.trim();
      if (!text) return;

      submitFeedback('General feedback', text);
      feedbackText.value = '';
      alert('Thank you for your feedback!');
      feedbackForm.hidden = true;
      input.focus();
    });

    newChatButton.addEventListener('click', startNewChat);

    addMessage('Hello! How can I help you with the Learning Portal today?', false);
  </script>
</body>
</html>
